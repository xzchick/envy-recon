[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envy-recon"
version = "0.1.1"
description = "ENVY Recon: a standalone OSINT terminal for domains, IPs, certificates, archives and file metadata"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "dnspython>=2.6,<3",
  "Pillow>=10,<12",
  "pypdf>=4,<6",
  "certifi>=2024.2.2",
]

[project.scripts]
envy-recon = "envy_recon.cli:main"

[tool.setuptools.packages.find]
include = ["envy_recon*"]
